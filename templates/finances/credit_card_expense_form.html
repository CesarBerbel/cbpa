{% extends "base/base.html" %}
{% load crispy_forms_tags %}

{% block content %}

<h1 class="h4 mb-1">Novo gasto no cartão</h1>
<p class="text-muted mb-4">{{ card }}</p>

<form method="post" class="card card-body shadow-sm border-0" novalidate>
    {% csrf_token %}
    {{ form|crispy }}

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{% url 'credit_card_detail' card.id %}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
</form>

{% endblock %}
