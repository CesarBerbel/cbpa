{% extends "base/base.html" %}

{% load crispy_forms_tags %}

{% block content %}

<div class="mb-4">
    <h1 class="h4 mb-1">
        Novo movimento
    </h1>

    <p class="text-muted mb-0">
        Conta: {{ account.name }} | Titular: {{ account.holder.full_name }}
    </p>
</div>

<form method="post" class="card card-body shadow-sm border-0" novalidate>
    {% csrf_token %}

    {{ form|crispy }}

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
            Salvar
        </button>

        <a href="{% url 'financial_account_detail' account.id %}" class="btn btn-outline-secondary">
            Cancelar
        </a>
    </div>
</form>

{% endblock %}
